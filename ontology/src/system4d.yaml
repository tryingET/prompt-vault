# prompt-vault in System4D terms.
# A core repo: AI Society's governed prompt-authoring store, a Dolt database driven by the bash/python pv CLI.
# Written for the agents that work in and beside this repo: read it before changing what the repo does or how.
# README.md, AGENTS.md and docs/project/ hold the long form; keep this file true to the shipped code.
ontology:
  system4d:
    name: "Prompt Vault"
    version: "0.1"
    container:
      boundary:
        in_scope:
          - "Reusable prompt templates, workflow and loop specifications as rows of the Dolt prompt_templates table (prompt-vault-db/), versioned per entity with history, branch, diff, merge, rollback and tags"
          - "Multi-file skills (skills + skill_assets tables); storage support does not mean skills have been imported"
          - "Governed semantics: the facets artifact_kind, control_mode and formalization_level, router controlled_vocabulary, and owner_company + visibility_companies, held by the contracts in ontology/*.json"
          - "Execution facts (executions, with optional output capture) and human judgments (feedback), plus aggregate quality rollups and analytics; retrieval telemetry goes to an append-only SQLite sidecar (analytics.db)"
          - "The local Pi prompt projection (export-to-pi, with a freshness receipt) and exports to TypeScript, Python and LangChain"
        out_of_scope:
          - "Running prompts against an LLM, execution bindings and loop supervision: downstream Pi/runtime owns them (AGENTS.md Intent, README.md Schema)"
          - "Runtime receipts, live telemetry and the shared runtime registry: pi-vault-client and the runtime own them (docs/dev/shared-runtime-registry-and-execution-observability-boundary.md)"
          - "Task, direction, decision and evidence state: Agent Kernel (ak) owns it; strategic_goals.md, tactical_goals.md and operating_plan.md are historical only"
          - "Shared vocabulary: concepts come from the core and company ontology layers in ontology/manifest.yaml; the repo defines its own only where those have none"
      constraints:
        - "Single-user local store: Dolt 0.40+, bash 4.0+, jq and python3; sqlite3 for the analytics sidecar; fzf optional for the pickers"
        - "Schema v13; a schema change ships as a numbered file in migrations/ and keeps schema/client-compatibility.json true (minimum supported schema 9)"
        - "Prompt bodies are canonical DB content, not repo files or ontology metadata"
        - "DB mutations follow the stage policy in docs/reference/db-stage-backup-policy.md: db-dev for exact-row edits with a Dolt commit; db-test and beyond need a backup quorum"
        - "SQL from the CLI goes through the shared escaping and input-check helpers in scripts/pv-lib.sh and reads Dolt as JSON, never CSV (docs/CRYSTALLIZED.md)"
      edges:
        - name: "Vault client"
          direction: "out"
          protocol: "file"
          system: "pi-vault-client (softwareco/owned/pi-extensions/packages/pi-vault-client): /vault commands and the vault_* LLM tools read and write the Dolt store"
          contract: "schema/client-compatibility.json, checked by scripts/pv-verify-client-compatibility"
        - name: "Pi prompt projection"
          direction: "out"
          protocol: "file"
          system: "Local Pi prompt files under ~/.pi/agent/prompts"
          contract: "docs/dev/pi-export-projection-boundary.md (export_to_pi means projection eligibility; .prompt-vault-export-state.json receipt)"
        - name: "Pi template import"
          direction: "in"
          protocol: "file"
          system: "Existing Pi prompt templates"
          contract: "scripts/import-from-pi.sh (./scripts/pv import)"
        - name: "Teacher-prep media runner provenance"
          direction: "out"
          protocol: "file"
          system: "Teacher-prep media live runner and its Teaching Packs"
          contract: "docs/dev/teacher-prep-media-prompt-authority-boundary.md (packs record entity_version and execution_id; their prompt-like files stay derived output)"
      dependencies:
        - name: "Dolt"
          type: "runtime"
          note: "Holds templates, skills, executions and feedback with Git-style history per row"
        - name: "Agent Kernel (ak)"
          type: "runtime"
          note: "Tasks, direction, decisions and evidence for this repo live in AK, not in markdown (docs/project/direction-workflow.md)"
        - name: "core/ontology-kernel and softwareco/ontology"
          type: "build"
          note: "The core and company ontology layers, resolved as workspace paths in ontology/manifest.yaml"
        - name: "core/rocs-cli"
          type: "build"
          note: "Runs the ontology checks through ./scripts/rocs.sh, which resolves ROCS_BIN, the workspace core/rocs-cli checkout, or rocs on PATH"
        - name: "engineering-core"
          type: "build"
          note: "The py engineering lane at v0.12.2: policy/engineering-lane.json points at it, docs/engineering.local.md holds the local overrides"
        - name: "bats"
          type: "build"
          note: "Runs the contract and full test suites through ./scripts/pv-bats and ./verify.sh"
      anti_goals:
        - "Free-form tags as a shadow taxonomy: removed in schema v6 in favour of facets and controlled vocabulary"
        - "Previewing or exporting private captured output; evidence surfaces grow only in privacy-safe, aggregate-first ways (docs/project/vision.md)"
        - "A status.md mirror of repo health; health comes from ./verify.sh and the quality and analytics commands"
        - "A checked-in work-items projection or a Markdown direction ladder (governance/README.md, docs/project/direction-workflow.md)"
    compass:
      drivers:
        - "Prompts sit scattered across files, chat history and notes, and flat files cannot answer which version performed best, what changed, or who wrote it and why (docs/project/purpose.md)"
        - "Downstream consumers such as pi-vault-client need a truthful prompt contract instead of inventing parallel prompt models (docs/project/vision.md)"
      outcomes:
        - "Operators and agents trust Prompt Vault as the source of prompt-authoring truth and find prompts by governed facets and visibility"
        - "Every execution and judgment accumulates as evidence, so weak prompts show up in quality rollups and strong ones compound"
        - "Reusable procedures exist for recurring cross-repo and governance work, with declared routes that resolve (policy/procedure-routes.json)"
      tradeoffs:
        - decision: "Where prompts live"
          chosen: "Rows in a Dolt database rather than flat files"
          because: "Git-for-data gives per-entity history, branch and merge (docs/decisions/README.md)"
        - decision: "How prompt meaning is expressed"
          chosen: "Contract-backed facets plus controlled vocabulary; free tags removed"
          because: "Keeps category boundaries and avoids shadow taxonomies (docs/CRYSTALLIZED.md)"
        - decision: "Whether execution output is stored"
          chosen: "Optional capture with an explicit privacy mode, private by default"
          because: "Privacy by default while still allowing auditable evidence (docs/decisions/README.md)"
        - decision: "Where retrieval telemetry lives"
          chosen: "An append-only SQLite sidecar (analytics.db), dropped from Dolt in schema v12"
          because: "Dolt suits versioned content, not per-request logging (docs/CRYSTALLIZED.md)"
        - decision: "How PTX and vault-client pick templates"
          chosen: "One shared FZF selection flow"
          because: "Pi's editor component is single-slot, so two custom editors overrode each other (ADR-0001)"
    engine:
      triggers:
        - "An operator runs ./scripts/pv (templates, edit-template, exec, rate, export, quality, migrate)"
        - "An agent calls a vault_* tool through pi-vault-client"
        - "An active template is published: the Pi projection refreshes by default, and with PV_AUTO_EXPORT=0 the publish fails closed instead of leaving it stale"
      states:
        - name: "draft / active / deprecated / archived"
          meaning: "Status of a template or skill (schema/schema.sql); only active, export-enabled rows reach the Pi projection"
        - name: "none / private / public"
          meaning: "output_capture_mode of an execution; only public output may be previewed"
      invariants:
        - id: "PV-INV-001"
          statement: "Captured output is private unless public is requested explicitly, public needs captured output, and preparing a prompt never records a simulated successful execution"
          enforcement: "test: scripts/pv-exec, tests/pv-exec-output-capture.bats"
        - id: "PV-INV-002"
          statement: "At most one feedback row exists per execution"
          enforcement: "db: unique_feedback_execution (migrations/008_add_feedback_execution_uniqueness.sql); test: tests/pv-feedback.bats"
        - id: "PV-INV-003"
          statement: "A template a declared procedure route selects cannot be retired or unexported; the command refuses before any row or projection mutation"
          enforcement: "test: scripts/pv-route-check, policy/procedure-routes.json, tests/pv-route-retirement.bats"
        - id: "PV-INV-004"
          statement: "The Pi projection counts as current only when its receipt and files match the DB; a stale file fails the freshness check, and gated or unbound templates never become raw Pi prompt files"
          enforcement: "test: scripts/pv-export-freshness, tests/pv-export-projection.bats"
        - id: "PV-INV-005"
          statement: "Ontology seed-contract metadata never carries prompt bodies, and the ontology index states the DB-only authoring boundary"
          enforcement: "test: scripts/pv-verify-ontology-contract, tests/pv-ontology-contract.bats; run by ./verify.sh"
      lifecycle:
        - "Author or edit a template with governed facets, vocabulary and visibility (pv edit-template, vault_insert, vault_update)"
        - "Commit it to Dolt; experiment on a branch, diff and merge"
        - "Publish: project active export-enabled rows to Pi prompts and write the freshness receipt"
        - "Execute with tracking (pv exec) and record a judgment (pv rate)"
        - "Read quality rollups and analytics, then iterate"
    fog:
      assumptions:
        - id: "PV-A-001"
          statement: "Execution success flags and ratings are enough evidence to rank prompts, although a stored success flag is not full behavioural proof (docs/project/model.md)"
          how_to_validate: "Compare execution rows with the feedback and evidence gaps in ./scripts/pv quality dashboard"
        - id: "PV-A-002"
          statement: "Skills are present in the store when a consumer expects them"
          how_to_validate: "./scripts/pv skills"
      risks:
        - id: "PV-R-001"
          statement: "Private execution output leaks through an analytics preview or export"
          mitigation: "PV-INV-001; analytics count private captures and preview public output only (scripts/pv-analytics)"
        - id: "PV-R-002"
          statement: "export_to_pi is read as 'already exported', so a stale local Pi prompt goes unnoticed after a DB write by direct SQL, migration or a headless path"
          mitigation: "PV-INV-004; run an explicit projection or freshness check after such writes (docs/dev/pi-export-projection-boundary.md)"
        - id: "PV-R-003"
          statement: "A schema change breaks pi-vault-client"
          mitigation: "schema/client-compatibility.json and scripts/pv-verify-client-compatibility, run by ./verify.sh"
      exceptions:
        - id: "PV-E-INCIDENT"
          statement: "Incident hotfix allowed"
          reason: "Record Exception immediately and Debt immediately"
      debt:
        - id: "PV-D-001"
          statement: "The column export_to_pi means pi_export_enabled, and the name invites misreading"
          payoff_plan: "Keep it for schema-v9 client compatibility until a governed schema migration renames or aliases it (docs/dev/pi-export-projection-boundary.md)"
